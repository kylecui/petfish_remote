<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetFish Remote — Web Console</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--accent-dim:#1f6feb;--green:#3fb950;--red:#f85149;--orange:#d29922;--radius:8px}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--accent)}

/* layout */
#app{display:flex;flex-direction:column;height:100vh;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
header .logo{font-size:18px;font-weight:600}
header .logo span{color:var(--accent)}
header .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
header .dot.ok{background:var(--green)}

/* messages */
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:var(--radius);word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent-dim);color:#fff;border-bottom-right-radius:2px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:2px}
.msg.system{align-self:center;color:var(--muted);font-size:12px;padding:4px 12px;background:transparent}
.msg.bot code{background:#1c2128;padding:1px 4px;border-radius:3px;font-size:13px}
.msg.bot pre{background:#1c2128;padding:8px 12px;border-radius:4px;overflow-x:auto;margin:6px 0}
.msg.bot pre code{background:none;padding:0}
.typing{align-self:flex-start;color:var(--muted);font-size:12px;padding:4px 14px;display:none}
.typing.show{display:block}

/* interactive cards */
.card{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;max-width:85%}
.card h4{margin-bottom:8px;font-size:13px;color:var(--accent)}
.card .options{display:flex;flex-wrap:wrap;gap:6px}
.card button{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px}
.card button:hover{border-color:var(--accent);color:var(--accent)}

/* command bar */
#cmd-bar{display:none;padding:8px 16px;border-top:1px solid var(--border);overflow-x:auto;white-space:nowrap;flex-shrink:0}
#cmd-bar.show{display:flex;gap:6px}
#cmd-bar button{padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap}
#cmd-bar button:hover{border-color:var(--accent);color:var(--accent)}

/* input */
#input-area{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
#input-area textarea{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:8px 12px;resize:none;font:inherit;min-height:40px;max-height:120px}
#input-area textarea:focus{outline:none;border-color:var(--accent)}
#input-area button{padding:8px 16px;background:var(--accent-dim);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-weight:500}
#input-area button:hover{background:var(--accent)}
#input-area button:disabled{opacity:.4;cursor:default}

/* auth */
#auth-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#auth-overlay.hidden{display:none}
#auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:400px;width:90%;text-align:center}
#auth-box h2{margin-bottom:8px;color:var(--accent)}
#auth-box p{color:var(--muted);margin-bottom:16px;font-size:13px}
#auth-box input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:inherit;margin-bottom:12px}
#auth-box input:focus{outline:none;border-color:var(--accent)}
#auth-box button{width:100%;padding:10px;background:var(--accent-dim);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-weight:500}
#auth-box .error{color:var(--red);font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>

<div id="auth-overlay">
  <div id="auth-box">
    <h2>&gt;&lt;(((^&gt; PetFish</h2>
    <p>Enter your Web API key to connect</p>
    <input id="auth-key" type="password" placeholder="API Key" autocomplete="off">
    <button type="button" onclick="connect()">Connect</button>
    <div class="error" id="auth-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">&gt;&lt;(((^&gt; <span>PetFish Remote</span></div>
    <div class="status"><div class="dot" id="status-dot"></div><span id="status-text">disconnected</span></div>
  </header>
  <div id="messages"></div>
  <div class="typing" id="typing">typing…</div>
  <div id="cmd-bar"></div>
  <div id="input-area">
    <textarea id="input" placeholder="Send a message…" rows="1" disabled></textarea>
    <button type="button" id="send-btn" onclick="send()" disabled>Send</button>
  </div>
</div>

<script>
(function(){
  let ws = null;
  let chatId = null;
  let apiKey = '';
  let typingTimeout = null;

  const $ = (s) => document.querySelector(s);
  const msgBox = $('#messages');
  const typingEl = $('#typing');
  const input = $('#input');
  const sendBtn = $('#send-btn');
  const cmdBar = $('#cmd-bar');
  const overlay = $('#auth-overlay');
  const statusDot = $('#status-dot');
  const statusText = $('#status-text');
  const authError = $('#auth-error');

  // check hash for key
  const hashKey = location.hash.slice(1);
  if (hashKey) {
    apiKey = hashKey;
    location.hash = '';
    doConnect();
  }

  window.connect = function() {
    apiKey = $('#auth-key').value.trim();
    if (!apiKey) return;
    doConnect();
  };

  function doConnect() {
    authError.style.display = 'none';
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host + '/ws/web?key=' + encodeURIComponent(apiKey);
    ws = new WebSocket(url);

    ws.onopen = function() {
      statusDot.classList.add('ok');
      statusText.textContent = 'connecting…';
    };

    ws.onmessage = function(e) {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    };

    ws.onclose = function(e) {
      statusDot.classList.remove('ok');
      statusText.textContent = 'disconnected';
      input.disabled = true;
      sendBtn.disabled = true;

      if (e.code === 4001) {
        authError.textContent = 'Invalid API key';
        authError.style.display = 'block';
        overlay.classList.remove('hidden');
        return;
      }

      if (chatId) {
        addSystem('Connection lost. Reconnecting in 3s…');
        setTimeout(doConnect, 3000);
      }
    };

    ws.onerror = function() {};
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'connected':
        chatId = msg.chatId;
        overlay.classList.add('hidden');
        statusText.textContent = 'connected';
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        addSystem('Connected as ' + chatId);
        if (msg.projects && msg.projects.length) {
          addSystem('Projects: ' + msg.projects.map(function(p){return p.name}).join(', '));
        }
        // request menu
        wsSend({type:'message',text:'/pf'});
        break;

      case 'message':
        hideTyping();
        addBot(msg.text);
        break;

      case 'typing':
        showTyping();
        break;

      case 'welcome':
        addBot(msg.text);
        break;

      case 'menu':
        renderMenu(msg);
        break;

      case 'question':
        renderQuestion(msg.payload);
        break;

      case 'permission':
        renderPermission(msg.payload);
        break;

      case 'projectList':
        renderProjectList(msg.projects);
        break;

      case 'sessionList':
        renderSessionList(msg.sessions);
        break;
    }
  }

  function addBot(text) {
    var el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = renderMarkdown(text || '');
    msgBox.appendChild(el);
    scrollDown();
  }

  function addUser(text) {
    var el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    msgBox.appendChild(el);
    scrollDown();
  }

  function addSystem(text) {
    var el = document.createElement('div');
    el.className = 'msg system';
    el.textContent = text;
    msgBox.appendChild(el);
    scrollDown();
  }

  function addCard(html) {
    var el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = html;
    msgBox.appendChild(el);
    scrollDown();
  }

  function renderMenu(msg) {
    cmdBar.innerHTML = '';
    if (!msg.commands) return;
    msg.commands.forEach(function(cmd) {
      var btn = document.createElement('button');
      btn.textContent = cmd.label;
      btn.onclick = function() { sendCommand('/pf ' + cmd.id); };
      cmdBar.appendChild(btn);
    });
    cmdBar.classList.add('show');
    if (msg.bound) {
      addSystem('Bound to project: ' + msg.bound);
    }
  }

  function renderQuestion(payload) {
    hideTyping();
    var html = '<h4>' + esc(payload.headline || 'Question') + '</h4>';
    if (payload.text) html += '<p>' + esc(payload.text) + '</p>';
    html += '<div class="options">';
    (payload.options || []).forEach(function(row, ri) {
      (Array.isArray(row) ? row : [row]).forEach(function(opt) {
        var label = typeof opt === 'string' ? opt : (opt.label || opt.text || JSON.stringify(opt));
        html += '<button onclick="window._answerQ(\'' + esc(payload.questionId) + '\',' + ri + ',\'' + esc(label) + '\')">' + esc(label) + '</button>';
      });
    });
    html += '</div>';
    addCard(html);
  }

  window._answerQ = function(qid, ri, label) {
    wsSend({type:'questionReply', questionId:qid, answers:[[label]]});
    addUser('→ ' + label);
  };

  function renderPermission(payload) {
    hideTyping();
    var html = '<h4>Permission Request</h4>';
    html += '<p>' + esc(payload.description || payload.action || '') + '</p>';
    html += '<div class="options">';
    html += '<button onclick="window._answerP(\'' + esc(payload.permissionId) + '\',true)">✅ Allow</button>';
    html += '<button onclick="window._answerP(\'' + esc(payload.permissionId) + '\',false)">❌ Deny</button>';
    html += '</div>';
    addCard(html);
  }

  window._answerP = function(pid, allowed) {
    wsSend({type:'permissionReply', permissionId:pid, allowed:allowed});
    addUser(allowed ? '→ Allowed' : '→ Denied');
  };

  function renderProjectList(projects) {
    if (!projects || !projects.length) { addSystem('No projects available'); return; }
    var html = '<h4>Projects</h4><div class="options">';
    projects.forEach(function(p) {
      var label = (p.active ? '● ' : '') + p.name;
      html += '<button onclick="window._bindProject(\'' + esc(p.id) + '\')">' + esc(label) + '</button>';
    });
    html += '</div>';
    addCard(html);
  }

  window._bindProject = function(id) {
    sendCommand('/pf use ' + id);
  };

  function renderSessionList(sessions) {
    if (!sessions || !sessions.length) { addSystem('No sessions'); return; }
    var html = '<h4>Sessions</h4><div class="options">';
    sessions.forEach(function(s) {
      var label = (s.active ? '● ' : '') + (s.title || s.slug);
      html += '<button onclick="window._switchSession(\'' + esc(s.slug) + '\')">' + esc(label) + '</button>';
    });
    html += '</div>';
    addCard(html);
  }

  window._switchSession = function(slug) {
    sendCommand('/pf switch ' + slug);
  };

  function sendCommand(text) {
    wsSend({type:'command', text:text});
    addUser(text);
  }

  window.send = function() {
    var text = input.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    wsSend({type:'message', text:text});
    addUser(text);
    input.value = '';
    autoResize();
  };

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      window.send();
    }
  });

  input.addEventListener('input', autoResize);

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  function wsSend(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  function showTyping() {
    typingEl.classList.add('show');
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(hideTyping, 30000);
    scrollDown();
  }

  function hideTyping() {
    typingEl.classList.remove('show');
    clearTimeout(typingTimeout);
  }

  function scrollDown() {
    requestAnimationFrame(function(){ msgBox.scrollTop = msgBox.scrollHeight; });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderMarkdown(text) {
    // code blocks
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(m,lang,code){
      return '<pre><code>' + esc(code) + '</code></pre>';
    });
    // inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
    // italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    text = text.replace(/_(.+?)_/g, '<em>$1</em>');
    // links
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return text;
  }

})();
</script>
</body>
</html>
